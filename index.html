
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b14">
<title>Messenger</title>

<style>
:root {
  --bg: #0b0b14;
  --panel: #141421;
  --panel2: #1c1b2c;
  --border: #29283c;
  --text: #f5f4ff;
  --muted: #9998b2;
  --purple: #9270ff;
  --blue: #36cfff;
  --green: #46dfb0;
  --danger: #ff6685;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button, input { font: inherit; }
button { cursor: pointer; }

.hidden { display: none !important; }

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

input {
  width: 100%;
  padding: 13px 14px;
  color: var(--text);
  background: #10101c;
  border: 1px solid var(--border);
  border-radius: 12px;
  outline: none;
}

input:focus { border-color: var(--purple); }

button.primary {
  padding: 12px 16px;
  color: white;
  background: var(--purple);
  border: 0;
  border-radius: 12px;
  font-weight: 700;
}

button.secondary {
  padding: 10px 13px;
  color: var(--text);
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 11px;
}

button.link {
  color: #b9a8ff;
  background: transparent;
  border: 0;
  padding: 6px;
}

.muted { color: var(--muted); }
.small { font-size: 12px; }
.error { color: var(--danger); }
.success { color: var(--green); }

#authScreen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 22px;
}

.auth-card {
  width: min(100%, 410px);
  padding: 28px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
}

.brand {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -.8px;
}

.brand span { color: var(--purple); }

.auth-card h1 {
  font-size: 23px;
  margin-bottom: 8px;
}

.auth-card form {
  display: grid;
  gap: 12px;
  margin-top: 22px;
}

.auth-actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
  align-items: center;
  flex-wrap: wrap;
}

#app {
  height: 100dvh;
  min-height: 500px;
  display: grid;
  grid-template-columns: 340px minmax(0, 1fr);
  overflow: hidden;
}

.sidebar {
  display: flex;
  flex-direction: column;
  min-width: 0;
  border-right: 1px solid var(--border);
  background: #10101a;
}

.side-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
}

.side-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 18px;
}

.side-title .brand { font-size: 23px; }

.profile-strip {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.avatar {
  flex: 0 0 43px;
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(135deg, #9270ff, #4c8fff);
  color: white;
  font-weight: 800;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile-name {
  min-width: 0;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 700;
}

.search-wrap {
  display: flex;
  gap: 8px;
  margin-top: 17px;
}

.search-wrap input { min-width: 0; }

#chatList {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.chat-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px 10px;
  text-align: left;
  color: var(--text);
  background: transparent;
  border: 0;
  border-radius: 14px;
}

.chat-row:hover, .chat-row.active {
  background: var(--panel2);
}

.chat-info {
  flex: 1;
  min-width: 0;
}

.chat-top, .chat-bottom {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
}

.chat-top { margin-bottom: 6px; }

.chat-name {
  font-size: 14px;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chat-preview {
  color: var(--muted);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 195px;
}

.chat-time {
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.unread-count {
  min-width: 19px;
  height: 19px;
  display: grid;
  place-items: center;
  padding: 0 5px;
  background: var(--purple);
  color: white;
  border-radius: 20px;
  font-size: 11px;
}

.side-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

.main {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at 70% 5%, #1a1530 0%, transparent 45%),
    var(--bg);
}

#welcome {
  flex: 1;
  display: grid;
  place-items: center;
  padding: 24px;
  text-align: center;
}

.welcome-icon {
  width: 72px;
  height: 72px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  border-radius: 24px;
  background: #211b39;
  color: #b9a8ff;
  font-size: 34px;
}

#welcome h1 {
  margin: 0 0 10px;
  font-size: clamp(22px, 3vw, 30px);
}

#welcome p {
  max-width: 390px;
  color: var(--muted);
  line-height: 1.6;
  font-size: 14px;
}

#conversation {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.chat-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  background: #11111c;
}

.chat-header-info { flex: 1; min-width: 0; }

.chat-header-name { font-weight: 800; }

#onlineLabel {
  margin-top: 4px;
  font-size: 12px;
  color: var(--muted);
}

#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 22px clamp(12px, 4vw, 35px);
}

.message {
  display: flex;
  max-width: min(78%, 520px);
  flex-direction: column;
  align-items: flex-start;
}

.message.mine { align-self: flex-end; align-items: flex-end; }

.bubble {
  padding: 11px 13px 7px;
  border: 1px solid var(--border);
  border-radius: 16px 16px 16px 5px;
  background: var(--panel);
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  line-height: 1.45;
}

.message.mine .bubble {
  background: #302451;
  border-color: #493777;
  border-radius: 16px 16px 5px 16px;
}

.message-meta {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  margin-top: 5px;
  font-size: 10px;
  color: #c0bfd0;
}

.message-ticks {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: -3px;
  padding-right: 3px;
}

.message-ticks.sent { color: #a7a7b4; }

.message-ticks.delivered { color: #b9b8c6; }

.message-ticks.read {
  color: var(--blue);
  text-shadow: 0 0 5px var(--blue), 0 0 12px #36cfff88;
}

.edited-label {
  color: var(--muted);
  font-size: 10px;
}

#sendForm {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  background: #11111c;
}

#messageInput {
  resize: none;
  min-width: 0;
  max-height: 130px;
}

#sendForm button { flex-shrink: 0; }

#status {
  padding: 5px 16px;
  min-height: 24px;
  font-size: 12px;
  color: var(--muted);
}

#backButton { display: none; }

.empty-state {
  padding: 24px 14px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
  text-align: center;
}

@media (max-width: 700px) {
  #app { grid-template-columns: 1fr; }

  .sidebar, .main { min-height: 0; }

  .sidebar {
    border-right: 0;
    height: 100%;
  }

  .main { display: none; }

  #app.chat-open .sidebar { display: none; }
  #app.chat-open .main { display: flex; }

  #backButton {
    display: inline-block;
    padding: 8px 10px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .side-header { padding: 15px; }
  .chat-header { padding: 12px; }
  #sendForm { padding: 10px; }
  #messages { padding: 16px 10px; }
  .message { max-width: 88%; }
}
</style>
</head>

<body>

<section id="authScreen">
  <div class="auth-card">
    <div class="brand">M<span>essenger</span></div>
    <p class="muted">Your conversations, together.</p>

    <div id="authFormArea">
      <h1 id="authHeading">Welcome back</h1>
      <p id="authDescription" class="muted small">Sign in to continue.</p>

      <form id="authForm">
        <div id="nameField" class="hidden">
          <input id="displayNameInput" placeholder="Your display name"
                 maxlength="60" autocomplete="name">
        </div>

        <input id="emailInput" type="email" placeholder="Email address"
               autocomplete="email" required>

        <input id="passwordInput" type="password" placeholder="Password"
               autocomplete="current-password" minlength="6" required>

        <button class="primary" id="authSubmit" type="submit">Sign in</button>
      </form>

      <div class="auth-actions">
        <button class="link" id="switchAuth" type="button">
          Create an account
        </button>
        <button class="link" id="resetPassword" type="button">
          Forgot password?
        </button>
      </div>
    </div>

    <div id="authMessage" class="small" role="status"></div>
  </div>
</section>

<section id="app" class="hidden">
  <aside class="sidebar">
    <div class="side-header">
      <div class="side-title">
        <div class="brand">M<span>essenger</span></div>
        <button class="secondary" id="newChatButton" type="button">+ New chat</button>
      </div>

      <div class="profile-strip">
        <div class="avatar" id="myAvatar">M</div>
        <div class="profile-name" id="myDisplayName">My profile</div>
        <button class="secondary" id="signOutButton" type="button">Sign out</button>
      </div>

      <div class="search-wrap">
        <input id="searchInput" type="search"
               placeholder="Search chats or usernames..."
               autocomplete="off">
      </div>
    </div>

    <div id="chatList">
      <div class="empty-state">Loading conversations...</div>
    </div>

    <div class="side-footer small muted">
      Keep your conversations private.
    </div>
  </aside>

  <main class="main">
    <section id="welcome">
      <div>
        <div class="welcome-icon">✦</div>
        <h1>Welcome to Messenger</h1>
        <p>Select a conversation from the left to start chatting with your friends.</p>
        <button class="primary" id="welcomeNewChat" type="button">Start a new chat</button>
      </div>
    </section>

    <section id="conversation" class="hidden">
      <header class="chat-header">
        <button id="backButton" type="button">←</button>
        <div class="avatar" id="targetAvatar">?</div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="targetName">Conversation</div>
          <div id="onlineLabel">Offline</div>
        </div>
      </header>

      <div id="messages" aria-live="polite"></div>
      <div id="status" role="status"></div>

      <form id="sendForm">
        <input id="messageInput" maxlength="4000"
               placeholder="Write a message..." autocomplete="off" required>
        <button class="primary" id="sendButton" type="submit">Send</button>
      </form>
    </section>
  </main>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* -------------------------------------------------------
   1. SUPABASE CONFIGURATION
   Replace these two values with your existing project's
   URL and publishable key. Never put a service-role key here.
------------------------------------------------------- */

const SUPABASE_URL = "https://ixttoxcoszadpmawccuf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_69nhwCbffOndwKFo4pMyDQ_KxsZDyWK";

if (
  SUPABASE_URL.includes("YOUR_SUPABASE") ||
  SUPABASE_PUBLISHABLE_KEY.includes("YOUR_SUPABASE")
) {
  document.getElementById("authMessage").textContent =
    "Add your Supabase project URL and publishable key in the code first.";
}

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

/* -------------------------------------------------------
   2. APPLICATION STATE
------------------------------------------------------- */

let user = null;
let myProfile = null;
let target = null;
let signUpMode = false;
let newChatMode = false;

let presenceChannel = null;
let messageChannel = null;
let profileChannel = null;

let presenceUsers = new Set();
let conversations = new Map();
let searchTimer = null;
let refreshTimer = null;
let lastSeenIds = new Set();

const $ = id => document.getElementById(id);

function setStatus(message, isError = false) {
  $("status").textContent = message || "";
  $("status").className = isError ? "error small" : "small";
}

function authMessage(message, isError = false) {
  $("authMessage").textContent = message;
  $("authMessage").className = isError ? "error small" : "small";
}

function escapeText(value) {
  return String(value ?? "");
}

function initials(name) {
  return (name || "?").trim().split(/\s+/).slice(0, 2)
    .map(part => part[0] || "").join("").toUpperCase() || "?";
}

function setAvatar(element, profile) {
  element.replaceChildren();

  if (profile && profile.avatar_url) {
    const img = document.createElement("img");
    img.src = profile.avatar_url;
    img.alt = "";
    img.onerror = () => {
      element.textContent = initials(profile.display_name || profile.username);
    };
    element.append(img);
  } else {
    element.textContent = initials(
      profile?.display_name || profile?.username || "?"
    );
  }
}

function formatTime(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";

  const now = new Date();
  const sameDay = date.toDateString() === now.toDateString();

  if (sameDay) {
    return date.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  return date.toLocaleDateString([], {
    day: "numeric",
    month: "short"
  });
}

function showAuth() {
  $("app").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
}

function showApp() {
  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("myDisplayName").textContent =
    myProfile?.display_name || myProfile?.username || user.email;

  setAvatar($("myAvatar"), myProfile);
  showWelcome();
  loadChats();
  startPresence();
  startMessageRealtime();
}

function showWelcome() {
  target = null;
  $("welcome").classList.remove("hidden");
  $("conversation").classList.add("hidden");
  $("app").classList.remove("chat-open");

  if (messageChannel) {
    db.removeChannel(messageChannel);
    messageChannel = null;
  }

  $("messages").replaceChildren();
  $("targetName").textContent = "Conversation";
  $("onlineLabel").textContent = "Offline";
  setStatus("");
}

function showConversation() {
  $("welcome").classList.add("hidden");
  $("conversation").classList.remove("hidden");
  $("app").classList.add("chat-open");
}

/* -------------------------------------------------------
   3. SIGN UP, SIGN IN, PROFILE
------------------------------------------------------- */

$("switchAuth").addEventListener("click", () => {
  signUpMode = !signUpMode;
  $("authHeading").textContent = signUpMode
    ? "Create your account" : "Welcome back";
  $("authDescription").textContent = signUpMode
    ? "Create an account to start messaging."
    : "Sign in to continue.";
  $("authSubmit").textContent = signUpMode
    ? "Create account" : "Sign in";
  $("switchAuth").textContent = signUpMode
    ? "Already have an account? Sign in"
    : "Create an account";
  $("nameField").classList.toggle("hidden", !signUpMode);
  $("displayNameInput").required = signUpMode;
  $("passwordInput").autocomplete =
    signUpMode ? "new-password" : "current-password";
  authMessage("");
});

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("authSubmit").disabled = true;
  authMessage("Please wait...");

  try {
    const email = $("emailInput").value.trim();
    const password = $("passwordInput").value;
    let result;

    if (signUpMode) {
      result = await db.auth.signUp({
        email,
        password,
        options: {
          data: {
            display_name: $("displayNameInput").value.trim()
          }
        }
      });
    } else {
      result = await db.auth.signInWithPassword({ email, password });
    }

    if (result.error) throw result.error;

    if (!result.data.session) {
      authMessage(
        "Account request received. Check your email to confirm your account, then sign in."
      );
      return;
    }

    user = result.data.user;
    await initialiseUser();
  } catch (error) {
    authMessage(error.message || "Authentication failed.", true);
  } finally {
    $("authSubmit").disabled = false;
  }
});

$("resetPassword").addEventListener("click", async () => {
  const email = $("emailInput").value.trim();

  if (!email) {
    authMessage("Enter your email address first.", true);
    return;
  }

  try {
    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin
    });
    if (error) throw error;
    authMessage("If the account exists, a password reset email will be sent.");
  } catch (error) {
    authMessage(error.message || "Could not request a password reset.", true);
  }
});

async function initialiseUser() {
  if (!user) return;

  const { data: existing, error } = await db
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

  if (error) throw error;

  if (existing) {
    myProfile = existing;
  } else {
    const metaName = user.user_metadata?.display_name || "";
    const baseName = metaName || (user.email || "user").split("@")[0];
    const username = await makeAvailableUsername(baseName);

    const { data: created, error: createError } = await db
      .from("profiles")
      .insert({
        id: user.id,
        username,
        display_name: baseName.slice(0, 60)
      })
      .select()
      .single();

    if (createError) {
      throw new Error(
        "Could not create your profile. Check your profiles table and RLS policies. " +
        createError.message
      );
    }

    myProfile = created;
  }

  showApp();
}

async function makeAvailableUsername(base) {
  let clean = String(base).toLowerCase()
    .replace(/[^a-z0-9_]/g, "")
    .slice(0, 18);

  if (clean.length < 3) clean = "user" + clean;

  let candidate = clean;

  for (let i = 0; i < 8; i++) {
    const { data, error } = await db
      .from("profiles")
      .select("id")
      .eq("username", candidate)
      .maybeSingle();

    if (error) throw error;
    if (!data) return candidate;

    candidate = clean + Math.floor(100 + Math.random() * 900);
  }

  return "user" + user.id.replace(/-/g, "").slice(0, 12);
}

$("signOutButton").addEventListener("click", async () => {
  try {
    if (presenceChannel) await db.removeChannel(presenceChannel);
    if (messageChannel) await db.removeChannel(messageChannel);
    if (profileChannel) await db.removeChannel(profileChannel);

    presenceChannel = messageChannel = profileChannel = null;

    const { error } = await db.auth.signOut();
    if (error) throw error;

    user = null;
    myProfile = null;
    target = null;
    presenceUsers.clear();
    conversations.clear();
    showAuth();
  } catch (error) {
    alert(error.message || "Could not sign out.");
  }
});

db.auth.onAuthStateChange((event, session) => {
  if (session?.user && !user) {
    user = session.user;
    setTimeout(async () => {
      try {
        await initialiseUser();
      } catch (error) {
        authMessage(error.message || "Could not load your profile.", true);
      }
    }, 0);
  }

  if (!session?.user) {
    user = null;
    myProfile = null;
    showAuth();
  }
});

/* -------------------------------------------------------
   4. CONVERSATION LIST
------------------------------------------------------- */

async function loadChats() {
  if (!user) return;

  const list = $("chatList");

  try {
    const { data: messages, error } = await db
      .from("messages")
      .select("id,sender_id,recipient_id,body,created_at,delivered_at,read_at")
      .or(`sender_id.eq.${user.id},recipient_id.eq.${user.id}`)
      .order("created_at", { ascending: false })
      .limit(500);

    if (error) throw error;

    const otherIds = [...new Set((messages || []).map(message =>
      message.sender_id === user.id
        ? message.recipient_id : message.sender_id
    ))];

    const profilesById = new Map();

    if (otherIds.length) {
      const { data: profiles, error: profileError } = await db
        .from("profiles")
        .select("id,username,display_name,avatar_url")
        .in("id", otherIds);

      if (profileError) throw profileError;

      for (const profile of profiles || []) {
        profilesById.set(profile.id, profile);
      }
    }

    conversations = new Map();

    for (const message of messages || []) {
      const otherId = message.sender_id === user.id
        ? message.recipient_id : message.sender_id;

      if (!conversations.has(otherId) && profilesById.has(otherId)) {
        conversations.set(otherId, {
          profile: profilesById.get(otherId),
          latest: message,
          unread: 0
        });
      }

      if (message.recipient_id === user.id && !message.read_at) {
        const current = conversations.get(otherId);
        if (current) current.unread++;
      }
    }

    renderChatList();

    if (target) {
      const updated = profilesById.get(target.id);
      if (updated) target = { ...target, ...updated };
    }
  } catch (error) {
    list.innerHTML = "";
    const message = document.createElement("div");
    message.className = "empty-state error";
    message.textContent = "Could not load chats: " + error.message;
    list.append(message);
  }
}

function renderChatList(filter = $("searchInput").value.trim().toLowerCase()) {
  const list = $("chatList");
  list.replaceChildren();

  let entries = [...conversations.entries()];

  if (filter && !newChatMode) {
    entries = entries.filter(([, item]) => {
      const name = item.profile.display_name || "";
      const username = item.profile.username || "";
      return name.toLowerCase().includes(filter) ||
             username.toLowerCase().includes(filter);
    });
  }

  entries.sort((a, b) =>
    new Date(b[1].latest.created_at) - new Date(a[1].latest.created_at)
  );

  if (!entries.length) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = filter && !newChatMode
      ? "No matching conversations. Tap + New chat to search usernames."
      : "No conversations yet. Tap + New chat to find someone.";
    list.append(empty);
    return;
  }

  for (const [id, item] of entries) {
    const profile = item.profile;
    const latest = item.latest;
    const row = document.createElement("button");
    row.type = "button";
    row.className = "chat-row" + (target?.id === id ? " active" : "");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    setAvatar(avatar, profile);

    const info = document.createElement("div");
    info.className = "chat-info";

    const top = document.createElement("div");
    top.className = "chat-top";

    const name = document.createElement("span");
    name.className = "chat-name";
    name.textContent = profile.display_name || profile.username;

    const time = document.createElement("span");
    time.className = "chat-time";
    time.textContent = formatTime(latest.created_at);

    top.append(name, time);

    const bottom = document.createElement("div");
    bottom.className = "chat-bottom";

    const preview = document.createElement("span");
    preview.className = "chat-preview";
    preview.textContent =
      (latest.sender_id === user.id ? "You: " : "") + latest.body;

    bottom.append(preview);

    if (item.unread > 0) {
      const badge = document.createElement("span");
      badge.className = "unread-count";
      badge.textContent = item.unread > 99 ? "99+" : item.unread;
      bottom.append(badge);
    }

    info.append(top, bottom);
    row.append(avatar, info);
    row.addEventListener("click", () => openChat(profile));
    list.append(row);
  }
}

/* -------------------------------------------------------
   5. FIND USERS TO START A NEW CHAT
------------------------------------------------------- */

$("newChatButton").addEventListener("click", startNewChat);
$("welcomeNewChat").addEventListener("click", startNewChat);

function startNewChat() {
  newChatMode = true;
  $("searchInput").value = "";
  $("searchInput").placeholder = "Enter an exact username...";
  $("searchInput").focus();

  $("chatList").replaceChildren();
  const hint = document.createElement("div");
  hint.className = "empty-state";
  hint.textContent = "Type a username to find someone.";
  $("chatList").append(hint);
}

$("searchInput").addEventListener("input", () => {
  clearTimeout(searchTimer);

  const query = $("searchInput").value.trim().toLowerCase();

  if (!newChatMode) {
    renderChatList(query);
    return;
  }

  searchTimer = setTimeout(() => findPeopleForNewChat(query), 250);
});

async function findPeopleForNewChat(query) {
  const list = $("chatList");
  list.replaceChildren();

  if (query.length < 2) {
    const hint = document.createElement("div");
    hint.className = "empty-state";
    hint.textContent = "Type at least two characters of a username.";
    list.append(hint);
    return;
  }

  try {
    const { data, error } = await db
      .from("profiles")
      .select("id,username,display_name,avatar_url")
      .ilike("username", query.replace(/[%_]/g, "") + "%")
      .neq("id", user.id)
      .order("username")
      .limit(20);

    if (error) throw error;

    if (!data?.length) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No users found.";
      list.append(empty);
      return;
    }

    for (const profile of data) {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "chat-row";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      setAvatar(avatar, profile);

      const info = document.createElement("div");
      info.className = "chat-info";

      const name = document.createElement("div");
      name.className = "chat-name";
      name.textContent = profile.display_name || profile.username;

      const username = document.createElement("div");
      username.className = "chat-preview";
      username.textContent = "@" + profile.username;

      info.append(name, username);
      row.append(avatar, info);
      row.addEventListener("click", () => {
        newChatMode = false;
        $("searchInput").value = "";
        $("searchInput").placeholder = "Search chats or usernames...";
        openChat(profile);
      });
      list.append(row);
    }
  } catch (error) {
    const msg = document.createElement("div");
    msg.className = "empty-state error";
    msg.textContent = error.message || "Could not search users.";
    list.append(msg);
  }
}

/* -------------------------------------------------------
   6. ONLINE PRESENCE
------------------------------------------------------- */

function startPresence() {
  if (!user) return;

  if (presenceChannel) db.removeChannel(presenceChannel);

  presenceUsers = new Set();

  presenceChannel = db.channel("messenger-presence", {
    config: { presence: { key: user.id } }
  });

  presenceChannel
    .on("presence", { event: "sync" }, () => {
      updatePresenceUsers();
    })
    .on("presence", { event: "join" }, () => {
      updatePresenceUsers();
    })
    .on("presence", { event: "leave" }, () => {
      updatePresenceUsers();
    })
    .subscribe(async status => {
      if (status === "SUBSCRIBED") {
        await presenceChannel.track({
          user_id: user.id,
          online_at: new Date().toISOString()
        });
      }
    });
}

function updatePresenceUsers() {
  if (!presenceChannel) return;

  const state = presenceChannel.presenceState();
  const next = new Set();

  for (const [id, metas] of Object.entries(state)) {
    if (metas && metas.length) next.add(id);
  }

  presenceUsers = next;
  updateOnlineLabel();
  renderChatList();

  // A recipient who is online can mark incoming messages delivered.
  markIncomingDelivered().catch(console.error);

  // Re-render current chat so the tick style follows presence.
  refreshVisibleTicks();
}

function isOnline(id) {
  return presenceUsers.has(id);
}

function updateOnlineLabel() {
  if (!target) return;

  $("onlineLabel").textContent = isOnline(target.id)
    ? "Online" : "Offline";
}

/* -------------------------------------------------------
   7. REAL-TIME MESSAGES
------------------------------------------------------- */

function startMessageRealtime() {
  if (messageChannel) db.removeChannel(messageChannel);

  messageChannel = db.channel("messenger-message-events-" + user.id);

  messageChannel
    .on("postgres_changes", {
      event: "*",
      schema: "public",
      table: "messages"
    }, payload => {
      const message = payload.new || payload.old;

      if (
        message &&
        (message.sender_id === user.id ||
         message.recipient_id === user.id)
      ) {
        loadChats();

        if (
          target &&
          (message.sender_id === target.id ||
           message.recipient_id === target.id)
        ) {
          loadCurrentMessages();
        }

        if (
          message &&
          message.recipient_id === user.id &&
          !message.read_at
        ) {
          markIncomingDelivered().catch(console.error);
        }
      }
    })
    .subscribe();
}

async function openChat(profile) {
  target = profile;
  showConversation();

  $("targetName").textContent =
    profile.display_name || profile.username;
  setAvatar($("targetAvatar"), profile);
  updateOnlineLabel();
  setStatus("");
  $("messageInput").focus();

  await loadCurrentMessages();

  if (isOnline(user.id)) {
    await markIncomingDelivered();
  }

  await markCurrentMessagesRead();

  renderChatList();

  if (profileChannel) db.removeChannel(profileChannel);

  profileChannel = db.channel("messenger-profile-" + profile.id)
    .on("postgres_changes", {
      event: "UPDATE",
      schema: "public",
      table: "profiles",
      filter: "id=eq." + profile.id
    }, payload => {
      if (target?.id === profile.id) {
        target = { ...target, ...payload.new };
        $("targetName").textContent =
          target.display_name || target.username;
        setAvatar($("targetAvatar"), target);
      }
    })
    .subscribe();
}

async function loadCurrentMessages() {
  if (!target || !user) return;

  const currentTargetId = target.id;

  const { data, error } = await db
    .from("messages")
    .select("id,sender_id,recipient_id,body,created_at,delivered_at,read_at")
    .or(
      `and(sender_id.eq.${user.id},recipient_id.eq.${currentTargetId}),` +
      `and(sender_id.eq.${currentTargetId},recipient_id.eq.${user.id})`
    )
    .order("created_at", { ascending: true })
    .limit(500);

  if (error) {
    setStatus("Could not load messages: " + error.message, true);
    return;
  }

  if (target?.id !== currentTargetId) return;

  const box = $("messages");
  const wasNearBottom =
    box.scrollHeight - box.scrollTop - box.clientHeight < 100;

  box.replaceChildren();

  for (const message of data || []) {
    renderMessage(message);
  }

  if (wasNearBottom) box.scrollTop = box.scrollHeight;
}

function renderMessage(message) {
  const wrapper = document.createElement("div");
  wrapper.className = "message" +
    (message.sender_id === user.id ? " mine" : "");

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = escapeText(message.body);

  const meta = document.createElement("div");
  meta.className = "message-meta";

  const time = document.createElement("time");
  time.dateTime = message.created_at;
  time.textContent = new Date(message.created_at).toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });

  meta.append(time);

  if (message.sender_id === user.id) {
    const ticks = document.createElement("span");
    ticks.className = "message-ticks";
    ticks.dataset.messageId = message.id;

    if (message.read_at) {
      ticks.textContent = "✓✓";
      ticks.classList.add("read");
      ticks.title = "Seen";
    } else if (isOnline(message.recipient_id)) {
      ticks.textContent = "✓✓";
      ticks.classList.add("delivered");
      ticks.title = "Recipient online; not yet read";
    } else {
      ticks.textContent = "✓";
      ticks.classList.add("sent");
      ticks.title = "Recipient offline";
    }

    meta.append(ticks);
  }

  bubble.append(meta);
  wrapper.append(bubble);
  $("messages").append(wrapper);
}

function refreshVisibleTicks() {
  if (!target) return;
  loadCurrentMessages();
}

/* -------------------------------------------------------
   8. DELIVERY AND READ RECEIPTS
------------------------------------------------------- */

async function markIncomingDelivered() {
  if (!user) return;

  // Presence is shared across the project. Only update messages
  // addressed to this user; RLS must enforce participant access.
  const { error } = await db
    .from("messages")
    .update({ delivered_at: new Date().toISOString() })
    .eq("recipient_id", user.id)
    .is("delivered_at", null);

  if (error) console.warn("Delivery receipt:", error.message);
}

async function markCurrentMessagesRead() {
  if (!user || !target) return;

  const otherId = target.id;

  const { error } = await db
    .from("messages")
    .update({ read_at: new Date().toISOString() })
    .eq("sender_id", otherId)
    .eq("recipient_id", user.id)
    .is("read_at", null);

  if (error) {
    console.warn("Read receipt:", error.message);
  } else {
    await loadCurrentMessages();
    await loadChats();
  }
}

/* -------------------------------------------------------
   9. SEND MESSAGE
------------------------------------------------------- */

$("sendForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!user || !target) {
    setStatus("Choose a conversation first.", true);
    return;
  }

  const body = $("messageInput").value.trim();
  if (!body) return;

  const recipient = target.id;
  $("sendButton").disabled = true;
  setStatus("Sending...");

  try {
    const { error } = await db
      .from("messages")
      .insert({
        sender_id: user.id,
        recipient_id: recipient,
        body
      });

    if (error) throw error;

    $("messageInput").value = "";
    setStatus("");
    await loadCurrentMessages();
    await loadChats();
    $("messages").scrollTop = $("messages").scrollHeight;
  } catch (error) {
    setStatus("Message not sent: " + error.message, true);
  } finally {
    $("sendButton").disabled = false;
    $("messageInput").focus();
  }
});

$("backButton").addEventListener("click", showWelcome);

/* -------------------------------------------------------
   10. STARTUP
------------------------------------------------------- */

(async function start() {
  try {
    const { data, error } = await db.auth.getSession();
    if (error) throw error;

    if (data.session?.user) {
      user = data.session.user;
      await initialiseUser();
    } else {
      showAuth();
    }
  } catch (error) {
    showAuth();
    authMessage(
      "Startup error: " + (error.message || "Check your Supabase configuration."),
      true
    );
  }
})();
</script>
