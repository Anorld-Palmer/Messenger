<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f0f2f5">
<title>Messenger</title>
<style>
:root{--blue:#1877f2;--bg:#f0f2f5;--text:#1c1e21;--muted:#65676b;--line:#e4e6eb;--green:#42b72a}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--bg)}button,input,textarea{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.primary{background:var(--blue);color:white;font-weight:bold;border-radius:7px;padding:12px 14px}.light{background:#e4e6eb;color:#1c1e21;border-radius:7px;padding:10px 13px}.green{background:var(--green);color:white;border-radius:7px;padding:13px 18px;font-weight:bold}.field{display:block;width:100%;padding:14px;margin-bottom:12px;border:1px solid #dddfe2;border-radius:7px;background:white;outline:none}.login-page{min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:45px;padding:24px}.intro{max-width:420px}.intro h1{font-size:46px;color:var(--blue);margin:0 0 12px}.intro p{font-size:23px;line-height:1.4;margin:0}.login-card{width:100%;max-width:390px;padding:18px;background:white;border-radius:10px;box-shadow:0 2px 12px #0002}.full{width:100%;font-size:20px}.link{display:block;margin:15px auto;background:none;color:var(--blue);font-size:14px}.divider{border:0;border-top:1px solid var(--line);margin:18px 0}.center{text-align:center}.status{font-size:13px;margin-top:12px;overflow-wrap:anywhere}.error{color:#b42318}.success{color:#067647}.app{min-height:100dvh;background:white;display:flex;flex-direction:column}.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:white;z-index:5}.brand{font-size:25px;font-weight:750;color:var(--blue)}.actions{display:flex;gap:8px}.circle{width:40px;height:40px;border-radius:50%;background:#e4e6eb;display:grid;place-items:center;font-size:19px;color:#222}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);flex:1;min-height:calc(100dvh - 123px)}.sidebar{border-right:1px solid var(--line);padding:16px 12px 20px;overflow:auto}.side-title{font-size:29px;margin:0 0 15px}.search{width:100%;padding:12px 15px;background:#f0f2f5;border:0;border-radius:24px;margin-bottom:12px;outline:none}.item{display:flex;align-items:center;gap:11px;padding:10px 8px;border-radius:10px;cursor:pointer;min-width:0}.item:hover,.item.active{background:#f0f2f5}.avatar{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:#dbeafe;color:#164e9b;display:grid;place-items:center;font-weight:bold;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.grow{flex:1;min-width:0}.name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview{font-size:13px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:20px;background:#e41e3f;color:white;font-size:11px}.right{min-width:0;display:flex;flex-direction:column;min-height:calc(100dvh - 123px)}.welcome{flex:1;display:grid;place-items:center;text-align:center;padding:28px;color:var(--muted)}.welcome h2{color:var(--text)}.welcome-icon{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#e7f0ff;color:var(--blue);font-size:37px}.chat-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}.chat-head .avatar{cursor:pointer}.messages{flex:1;min-height:180px;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.msg{max-width:min(75%,520px);padding:10px 13px;border-radius:18px;overflow-wrap:anywhere;white-space:pre-wrap}.msg.mine{align-self:flex-end;background:var(--blue);color:white;border-bottom-right-radius:5px}.msg.theirs{align-self:flex-start;background:#e4e6eb;border-bottom-left-radius:5px}.meta{text-align:right;font-size:11px;opacity:.8;margin-top:5px}.tick{font-weight:bold;letter-spacing:-3px;margin-left:4px}.tick.read{color:#7de0ff;text-shadow:0 0 7px #00bfff}.composer{display:flex;gap:9px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}.composer textarea{flex:1;resize:none;max-height:120px;border:0;border-radius:20px;background:#f0f2f5;padding:12px;outline:none}.send{width:42px;height:42px;border-radius:50%;background:var(--blue);color:white;font-size:18px}.bottomnav{display:flex;justify-content:space-around;gap:2px;border-top:1px solid var(--line);background:white;padding:5px 4px calc(5px + env(safe-area-inset-bottom));position:sticky;bottom:0;z-index:4}.nav{position:relative;flex:1;background:transparent;color:var(--muted);padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}.nav .ico{font-size:21px}.nav.active{color:var(--blue);font-weight:bold}.nav.active:after{content:"";position:absolute;top:-6px;width:55%;height:3px;border-radius:3px;background:var(--blue)}.panel{padding:15px;background:white;border-radius:12px;margin:10px 0;box-shadow:0 1px 3px #0001}.empty{text-align:center;padding:24px;color:var(--muted);font-size:14px}.story-rail{display:flex;gap:11px;overflow:auto;padding:5px 0 15px}.story{position:relative;flex-shrink:0;width:112px;height:170px;border-radius:13px;overflow:hidden;background:linear-gradient(145deg,#c9d9ff,#7765ef);color:white;display:flex;flex-direction:column;justify-content:space-between;padding:9px;cursor:pointer}.story img,.story video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.story:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#0009)}.story>*{position:relative;z-index:1}.story-label{font-size:12px;font-weight:bold}.tab-title{font-size:27px;margin:0 0 14px}.call-row{display:flex;align-items:center;gap:10px;padding:12px 3px;border-bottom:1px solid #eee}.call-actions{display:flex;gap:5px}.modal-bg{position:fixed;inset:0;z-index:20;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:min(100%,460px);max-height:90dvh;overflow:auto;background:white;border-radius:13px;padding:20px}.modal h3{margin-top:0}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px;flex-wrap:wrap}.photo-view{max-width:90vw;max-height:85dvh;object-fit:contain}.viewer{position:fixed;inset:0;background:#111;color:white;z-index:30;display:grid;place-items:center;padding:20px}.viewer img,.viewer video{max-width:90vw;max-height:75dvh;border-radius:10px}.file-input{display:none}.call-screen{position:fixed;inset:0;z-index:40;background:#101522;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}.call-screen video{max-width:min(90vw,500px);max-height:45dvh;border-radius:14px;background:#222}.call-controls{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:24px}.call-controls button{border-radius:50%;width:58px;height:58px;background:#30394b;color:white;font-size:20px}.call-controls .hangup{background:#e11d48}.call-controls button:disabled{opacity:.4}.call-status{color:#cbd5e1;margin:12px}.story-text{max-width:600px;padding:48px 24px;border-radius:16px;background:linear-gradient(140deg,#6658d3,#1877f2);font-size:25px;overflow-wrap:anywhere;white-space:pre-wrap}.subheading{font-size:16px;margin:16px 0 8px}
@media(max-width:760px){.login-page{flex-direction:column;gap:22px;padding:28px 16px}.intro{text-align:center}.intro h1{font-size:39px}.intro p{font-size:18px}.login-card{max-width:420px}.layout{display:block;min-height:calc(100dvh - 123px)}.sidebar{border:0;padding:15px 12px;min-height:calc(100dvh - 123px)}.right{display:none;min-height:calc(100dvh - 123px)}.app.chat-open .sidebar{display:none}.app.chat-open .right{display:flex}.topbar{height:58px;padding:0 12px}.bottomnav{height:63px}.messages{padding:13px}.msg{max-width:88%}.welcome{min-height:60vh}}
</style>
</head>
<body>
<section id="authPage"><div class="login-page"><div class="intro"><h1>Messenger</h1><p>Connect with friends and people around you.</p></div><div class="login-card">
<form id="loginForm"><input class="field" id="loginEmail" type="email" placeholder="Email address" autocomplete="email" required><input class="field" id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required><button class="primary full" type="submit">Log In</button><button class="link" id="forgotBtn" type="button">Forgotten password?</button><hr class="divider"><button class="green" id="showRegister" type="button" style="display:block;margin:auto">Create New Account</button></form>
<form id="registerForm" class="hidden"><h2>Create an account</h2><input class="field" id="regName" placeholder="Full name" autocomplete="name" required><input class="field" id="regUsername" placeholder="Choose a username" autocomplete="username" required><input class="field" id="regEmail" type="email" placeholder="Email address" autocomplete="email" required><input class="field" id="regPassword" type="password" minlength="8" placeholder="Password (minimum 8 characters)" autocomplete="new-password" required><button class="primary full" type="submit">Create Account</button><button class="link" id="showLogin" type="button">Back to Log In</button></form><div id="authMessage" class="status" role="status"></div></div></div></section>
<section id="appPage" class="app hidden"><header class="topbar"><div class="brand">Messenger</div><div class="actions"><button class="circle" id="newChat" title="New chat">✎</button><button class="circle" id="profileBtn" title="Profile">☻</button><button class="circle" id="logoutBtn" title="Log out">↪</button></div></header>
<main class="layout"><aside class="sidebar" id="sidebar"><h2 class="side-title" id="sideTitle">Chats</h2><input class="search" id="searchBox" placeholder="Search Messenger"><div id="sideContent"></div></aside><section class="right"><div class="welcome" id="welcome"><div><div class="welcome-icon">✉</div><h2>Welcome to Messenger</h2><p>Select a conversation from the left to start chatting with your friends.</p></div></div>
<div id="conversation" class="hidden" style="flex:1;min-height:0;flex-direction:column"><div class="chat-head"><button class="circle" id="backBtn" aria-label="Back">‹</button><div class="avatar" id="chatAvatar">M</div><div class="grow"><div class="name" id="chatName">Conversation</div><div class="preview" id="chatStatus">Messenger</div></div><button class="circle" id="voiceBtn" title="Voice call">☎</button><button class="circle" id="videoBtn" title="Video call">▣</button></div><div class="messages" id="messages"></div><form class="composer" id="composer"><textarea id="messageInput" rows="1" maxlength="5000" placeholder="Message…" required></textarea><button class="send" type="submit" aria-label="Send">➤</button></form></div></section></main>
<nav class="bottomnav"><button class="nav active" data-tab="chats"><span class="ico">☏</span>Chats</button><button class="nav" data-tab="updates"><span class="ico">◉</span>Updates</button><button class="nav" data-tab="calls"><span class="ico">☎</span>Calls</button><button class="nav" data-tab="contacts"><span class="ico">♙</span>Contacts</button></nav></section>
<div id="modalHost"></div><div id="storyViewer" class="hidden"></div><div id="callHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Paste your Supabase publishable/anon key here. Never use service_role in browser code.
const SUPABASE_URL="https://ixttoxcoszadpmawccuf.supabase.co";
const SUPABASE_KEY="YOUR_SUPABASE_PUBLISHABLE_KEY";
// Optional: add TURN credentials from your provider for reliable calls across restrictive networks.
const TURN_ICE_SERVERS=[]; // Example: [{urls:"turn:turn.example.com:3478",username:"TEMP_USERNAME",credential:"TEMP_PASSWORD"}]
const db=window.supabase&&!SUPABASE_KEY.startsWith("YOUR_")?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=id=>document.getElementById(id);
const S={user:null,profile:null,profiles:[],conversations:[],selected:null,messages:[],tab:"chats",search:"",stories:[],storyUrls:new Map(),online:new Set(),messageChannel:null,presenceChannel:null,callsChannel:null,callSignalsChannel:null,activeCall:null,callRows:[]};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function say(el,msg,kind="status"){if(!el)return;el.textContent=msg;el.className="status "+kind;}
function initials(p){return (p?.display_name||p?.username||"?").trim().slice(0,1).toUpperCase();}
function avatar(p){return `<div class="avatar">${p?.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:esc(initials(p))}</div>`;}
function other(id){return S.profiles.find(p=>p.id===id)||{id,username:"user",display_name:"Messenger user"};}
function time(v){return v?new Date(v).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"";}
function date(v){if(!v)return "";const d=new Date(v);return d.toDateString()===new Date().toDateString()?time(v):d.toLocaleDateString([],{month:"short",day:"numeric"});}
function showAuthMessage(msg,kind="error"){say($("authMessage"),msg,kind);}
function configured(){if(!db){showAuthMessage("Add your Supabase publishable key in the configuration section.");return false;}return true;}
function closeModal(){$("modalHost").innerHTML="";}

// AUTH
$("showRegister").onclick=()=>{$("loginForm").classList.add("hidden");$("registerForm").classList.remove("hidden");showAuthMessage("");};
$("showLogin").onclick=()=>{$("registerForm").classList.add("hidden");$("loginForm").classList.remove("hidden");showAuthMessage("");};
$("loginForm").onsubmit=async e=>{e.preventDefault();if(!configured())return;showAuthMessage("Signing in…","success");const {error}=await db.auth.signInWithPassword({email:$("loginEmail").value.trim(),password:$("loginPassword").value});if(error)showAuthMessage(error.message);};
$("registerForm").onsubmit=async e=>{e.preventDefault();if(!configured())return;const name=$("regName").value.trim(),username=$("regUsername").value.trim().toLowerCase().replace(/^@/,""),email=$("regEmail").value.trim(),password=$("regPassword").value;if(!/^[a-z0-9_.]{3,25}$/.test(username)){showAuthMessage("Username must be 3–25 characters using letters, numbers, dots or underscores.");return;}if(!name||!email||password.length<8){showAuthMessage("Complete all fields. Password must contain at least 8 characters.");return;}showAuthMessage("Creating your account…","success");const {data,error}=await db.auth.signUp({email,password,options:{data:{display_name:name,username}}});if(error){showAuthMessage(error.message);return;}if(data.user){const {error:pe}=await db.from("profiles").upsert({id:data.user.id,username,display_name:name},{onConflict:"id"});if(pe)showAuthMessage("Account created; profile setup needs attention: "+pe.message);else showAuthMessage("Account created. Check your email if confirmation is required.","success");}};
$("forgotBtn").onclick=async()=>{if(!configured())return;const email=$("loginEmail").value.trim();if(!email.includes("@")){showAuthMessage("Enter your email address first.");return;}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href});showAuthMessage(error?error.message:"Check your email for password reset instructions.",error?"error":"success");};
async function boot(session){if(!session){S.user=null;S.profile=null;stopCallListeners();$("authPage").classList.remove("hidden");$("appPage").classList.add("hidden");return;}S.user=session.user;$("authPage").classList.add("hidden");$("appPage").classList.remove("hidden");await loadProfile();await loadProfiles();await loadConversations();await loadStories();startPresence();startCallListeners();renderSide();}
if(db){db.auth.onAuthStateChange((_event,session)=>setTimeout(()=>boot(session),0));db.auth.getSession().then(({data})=>boot(data.session));}else showAuthMessage("Add your Supabase publishable key before using Messenger.");

// PROFILE
async function loadProfile(){const {data,error}=await db.from("profiles").select("*").eq("id",S.user.id).maybeSingle();if(error){console.warn(error.message);return;}S.profile=data;if(!data){const meta=S.user.user_metadata||{};let username=(meta.username||S.user.email?.split("@")[0]||"user").toLowerCase().replace(/[^a-z0-9_.]/g,"").slice(0,25);const {data:created,error:pe}=await db.from("profiles").upsert({id:S.user.id,username,display_name:meta.display_name||username},{onConflict:"id"}).select().maybeSingle();if(!pe)S.profile=created;}}
async function loadProfiles(){const {data,error}=await db.from("profiles").select("id,username,display_name,avatar_url,about,created_at").neq("id",S.user.id).order("display_name");if(!error)S.profiles=data||[];}
async function loadConversations(){const {data,error}=await db.from("messages").select("id,sender_id,recipient_id,body,created_at,delivered_at,read_at").or(`sender_id.eq.${S.user.id},recipient_id.eq.${S.user.id}`).order("created_at",{ascending:false}).limit(500);if(error){console.warn("Messages query:",error.message);return;}const map=new Map();for(const m of data||[]){const id=m.sender_id===S.user.id?m.recipient_id:m.sender_id;if(!map.has(id))map.set(id,{id,last:m,unread:0});if(m.recipient_id===S.user.id&&m.sender_id!==S.user.id&&!m.read_at)map.get(id).unread++;}S.conversations=[...map.values()].sort((a,b)=>new Date(b.last.created_at)-new Date(a.last.created_at));}

// NAV
 document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$("newChat").onclick=()=>setTab("contacts");$("profileBtn").onclick=openProfile;$("logoutBtn").onclick=async()=>{if(db)await db.auth.signOut();};$("searchBox").oninput=e=>{S.search=e.target.value.trim().toLowerCase();renderSide();};
function setTab(tab){S.tab=tab;S.selected=null;$("appPage").classList.remove("chat-open");$("welcome").classList.remove("hidden");$("conversation").classList.add("hidden");$("conversation").style.display="none";document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("sideTitle").textContent=({chats:"Chats",updates:"Updates",calls:"Calls",contacts:"Contacts"})[tab];$("searchBox").placeholder=tab==="contacts"?"Search people":"Search Messenger";$("searchBox").value="";S.search="";renderSide();}
function renderSide(){if(!S.user)return;if(S.tab==="chats")renderChats();else if(S.tab==="contacts")renderContacts();else if(S.tab==="updates")renderUpdates();else renderCalls();}
function renderChats(){const items=S.conversations.filter(c=>{const p=other(c.id);return (p.display_name+" "+p.username+" "+(c.last.body||"")).toLowerCase().includes(S.search);});$("sideContent").innerHTML=items.length?items.map(c=>{const p=other(c.id),m=c.last;return `<div class="item ${S.selected?.id===p.id?"active":""}" data-user="${esc(p.id)}">${avatar(p)}<div class="grow"><div class="row between"><div class="name">${esc(p.display_name||p.username)}</div><span class="small muted">${esc(date(m.created_at))}</span></div><div class="row"><div class="preview">${m.sender_id===S.user.id?"You: ":""}${esc(m.body)}</div>${c.unread?`<span class="badge">${c.unread}</span>`:""}</div></div></div>`;}).join(""):'<div class="empty">No conversations yet. Open Contacts to start a chat.</div>';$ ("sideContent").querySelectorAll("[data-user]").forEach(el=>el.onclick=()=>openChat(el.dataset.user));}
function renderContacts(){const items=S.profiles.filter(p=>(p.username+" "+p.display_name).toLowerCase().includes(S.search));$("sideContent").innerHTML=`<div class="row between" style="margin:4px 0 12px"><span class="small muted">Registered users</span><button class="light" id="inviteBtn">Invite</button></div>`+(items.map(p=>`<div class="item" data-user="${esc(p.id)}">${avatar(p)}<div class="grow"><div class="name">${esc(p.display_name||p.username)}</div><div class="preview">@${esc(p.username||"")}</div></div><button class="light" data-message="${esc(p.id)}">Message</button></div>`).join("")||'<div class="empty">No users found.</div>');$("inviteBtn").onclick=invitePeople;$("sideContent").querySelectorAll("[data-user]").forEach(el=>el.onclick=()=>openChat(el.dataset.user));$("sideContent").querySelectorAll("[data-message]").forEach(el=>el.onclick=e=>{e.stopPropagation();openChat(el.dataset.message);});}
async function invitePeople(){const data={title:"Join me on Messenger",text:"Connect with me on Messenger.",url:location.href};try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);alert("Invite link copied.");}else prompt("Copy this invite link:",location.href);}catch(e){if(e.name!=="AbortError")alert("Share this link with your contacts: "+location.href);}}

// MESSAGING + RECEIPTS
async function openChat(id){S.selected=other(id);$("appPage").classList.add("chat-open");$("welcome").classList.add("hidden");$("conversation").classList.remove("hidden");$("conversation").style.display="flex";$("chatName").textContent=S.selected.display_name||S.selected.username;$("chatStatus").textContent=S.online.has(id)?"Active now":"Messenger";$("chatAvatar").innerHTML=S.selected.avatar_url?`<img src="${esc(S.selected.avatar_url)}" alt="">`:esc(initials(S.selected));$("chatAvatar").onclick=()=>viewPhoto(S.selected);await loadMessages();subscribeMessages();await markRead();if(S.tab==="chats")renderChats();}
async function loadMessages(){if(!S.selected)return;const id=S.selected.id;const filter=`and(sender_id.eq.${S.user.id},recipient_id.eq.${id}),and(sender_id.eq.${id},recipient_id.eq.${S.user.id})`;const {data,error}=await db.from("messages").select("*").or(filter).order("created_at",{ascending:true}).limit(300);if(error){$("messages").innerHTML=`<div class="empty">Unable to load messages: ${esc(error.message)}</div>`;return;}S.messages=data||[];await markDelivered();renderMessages();}
function renderMessages(){$("messages").innerHTML=S.messages.map(m=>{const mine=m.sender_id===S.user.id;const ticks=!mine?"":m.read_at?'<span class="tick read">✓✓</span>':m.delivered_at?'<span class="tick">✓✓</span>':'<span class="tick">✓</span>';return `<div class="msg ${mine?"mine":"theirs"}">${esc(m.body)}<div class="meta">${esc(time(m.created_at))}${ticks}</div></div>`;}).join("");$("messages").scrollTop=$("messages").scrollHeight;}
$("composer").onsubmit=async e=>{e.preventDefault();const body=$("messageInput").value.trim();if(!body||!S.selected)return;const old=$("messageInput").value;$("messageInput").value="";const {data,error}=await db.from("messages").insert({sender_id:S.user.id,recipient_id:S.selected.id,body}).select().single();if(error){$("messageInput").value=old;alert("Message failed: "+error.message);return;}S.messages.push(data);renderMessages();await loadConversations();renderChats();};$("messageInput").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("composer").requestSubmit();}};$("backBtn").onclick=()=>setTab("chats");
async function markDelivered(){const ids=S.messages.filter(m=>m.recipient_id===S.user.id&&!m.delivered_at).map(m=>m.id);if(!ids.length)return;const {error}=await db.from("messages").update({delivered_at:new Date().toISOString()}).in("id",ids);if(error)console.warn("Delivery receipts need appropriate RLS policies:",error.message);}
async function markRead(){if(!S.selected)return;const ids=S.messages.filter(m=>m.recipient_id===S.user.id&&!m.read_at).map(m=>m.id);if(!ids.length)return;const now=new Date().toISOString();const {error}=await db.from("messages").update({delivered_at:now,read_at:now}).in("id",ids);if(error){console.warn("Read receipts need appropriate RLS policies:",error.message);return;}S.messages=S.messages.map(m=>ids.includes(m.id)?{...m,delivered_at:now,read_at:now}:m);renderMessages();await loadConversations();renderChats();}
function subscribeMessages(){if(S.messageChannel)db.removeChannel(S.messageChannel);S.messageChannel=db.channel("message-feed-"+S.user.id).on("postgres_changes",{event:"*",schema:"public",table:"messages"},async payload=>{const m=payload.new||payload.old;if(!m||(m.sender_id!==S.user.id&&m.recipient_id!==S.user.id))return;await loadConversations();if(S.selected&&(m.sender_id===S.selected.id||m.recipient_id===S.selected.id)){await loadMessages();await markRead();}else renderChats();}).subscribe();}
function startPresence(){if(S.presenceChannel)db.removeChannel(S.presenceChannel);S.presenceChannel=db.channel("online-users",{config:{presence:{key:S.user.id}}});S.presenceChannel.on("presence",{event:"sync"},()=>{S.online=new Set(Object.keys(S.presenceChannel.presenceState()));if(S.selected)$("chatStatus").textContent=S.online.has(S.selected.id)?"Active now":"Messenger";}).subscribe(async status=>{if(status==="SUBSCRIBED")await S.presenceChannel.track({online_at:new Date().toISOString()});});}

// PROFILE EDITING (profile-photos bucket must be configured separately)
async function openProfile(){if(!S.profile){alert("Your profile has not loaded yet.");return;}const p=S.profile;$("modalHost").innerHTML=`<div class="modal-bg" id="profileBg"><div class="modal"><h3>Your profile</h3><div class="center" style="margin:12px">${avatar(p)}</div><label class="small muted">Display name</label><input class="field" id="editName" value="${esc(p.display_name||"")}"><label class="small muted">Username</label><input class="field" id="editUsername" value="${esc(p.username||"")}"><label class="small muted">About</label><textarea class="field" id="editAbout" maxlength="160">${esc(p.about||"")}</textarea><input class="file-input" id="photoFile" type="file" accept="image/*" capture="user"><div class="row"><button class="light" id="changePhoto">Change photo</button><button class="light" id="viewMyPhoto">View photo</button></div><div id="profileMessage" class="status"></div><div class="modal-actions"><button class="light" id="cancelProfile">Cancel</button><button class="primary" id="saveProfile">Save changes</button></div></div></div>`;$("cancelProfile").onclick=closeModal;$("changePhoto").onclick=()=>$("photoFile").click();$("viewMyPhoto").onclick=()=>viewPhoto(S.profile);$("photoFile").onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith("image/")||file.size>5*1024*1024){say($("profileMessage"),"Choose an image smaller than 5 MB.","error");return;}const path=`${S.user.id}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;const {error}=await db.storage.from("profile-photos").upload(path,file,{upsert:false,contentType:file.type});if(error){say($("profileMessage"),"Photo upload failed: "+error.message,"error");return;}const {data}=db.storage.from("profile-photos").getPublicUrl(path);const {error:pe}=await db.from("profiles").update({avatar_url:data.publicUrl}).eq("id",S.user.id);if(pe){say($("profileMessage"),pe.message,"error");return;}S.profile.avatar_url=data.publicUrl;say($("profileMessage"),"Photo updated (temporary URL).","success");};$("saveProfile").onclick=async()=>{const username=$("editUsername").value.trim().toLowerCase().replace(/^@/,"");if(!/^[a-z0-9_.]{3,25}$/.test(username)){say($("profileMessage"),"Username must be 3–25 characters using letters, numbers, dots or underscores.","error");return;}const {data,error}=await db.from("profiles").upsert({id:S.user.id,username,display_name:$("editName").value.trim(),about:$("editAbout").value.trim()},{onConflict:"id"}).select().single();if(error){say($("profileMessage"),error.message,"error");return;}S.profile=data;await loadProfiles();renderSide();say($("profileMessage"),"Profile saved.","success");};}
function viewPhoto(p){if(!p?.avatar_url){alert("No profile photo has been added.");return;}$("modalHost").innerHTML=`<div class="modal-bg" id="photoBg"><img class="photo-view" src="${esc(p.avatar_url)}" alt="Profile photo"></div>`;$("photoBg").onclick=closeModal;}

// STORIES: schema matches public.stories (type, text, media_path, created_at, expires_at).
const STORY_BUCKET="story-media";const STORY_MAX_BYTES=50*1024*1024;const ALLOWED_STORY_TYPES=new Set(["image/jpeg","image/png","image/webp","image/gif","video/mp4","video/webm"]);
async function uploadStoryMedia(file){if(!file)throw new Error("Choose a photo or video first.");if(!ALLOWED_STORY_TYPES.has(file.type))throw new Error("Supported formats: JPEG, PNG, WebP, GIF, MP4 and WebM.");if(file.size>STORY_MAX_BYTES)throw new Error("Maximum story file size is 50 MB.");const {data:{user},error:ae}=await db.auth.getUser();if(ae||!user)throw new Error("Please sign in before posting a story.");const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");const path=`${user.id}/${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from(STORY_BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;return path;}
async function publishStory({type,text="",file=null}){if(!S.user)throw new Error("Please sign in first.");let mediaPath=null;if(type==="text"){text=text.trim();if(!text)throw new Error("Enter some story text.");}else if(type==="image"||type==="video"){if(!file)throw new Error("Choose a media file.");if(type==="image"&&!file.type.startsWith("image/"))throw new Error("Choose an image.");if(type==="video"&&!file.type.startsWith("video/"))throw new Error("Choose a video.");mediaPath=await uploadStoryMedia(file);}else throw new Error("Unsupported story type.");const {data,error}=await db.from("stories").insert({user_id:S.user.id,type,text:type==="text"?text:null,media_path:mediaPath,expires_at:new Date(Date.now()+24*60*60*1000).toISOString()}).select().single();if(error){if(mediaPath)await db.storage.from(STORY_BUCKET).remove([mediaPath]);throw error;}return data;}
async function getStoryMediaUrl(path){if(!path)return null;const cached=S.storyUrls.get(path);if(cached&&cached.expires>Date.now()+15000)return cached.url;const {data,error}=await db.storage.from(STORY_BUCKET).createSignedUrl(path,300);if(error)throw error;S.storyUrls.set(path,{url:data.signedUrl,expires:Date.now()+285000});return data.signedUrl;}
async function loadStories(){const {data,error}=await db.from("stories").select("id,user_id,type,text,media_path,created_at,expires_at").gt("expires_at",new Date().toISOString()).order("created_at",{ascending:false}).limit(100);if(error){console.warn("Stories load failed:",error.message);S.stories=[];return;}S.stories=[];for(const story of data||[]){let media_url=null;if(story.media_path){try{media_url=await getStoryMediaUrl(story.media_path);}catch(e){console.warn("Could not sign story media",e.message);}}S.stories.push({...story,media_url});}}
function renderUpdates(){const host=$("sideContent");host.innerHTML=`<div class="panel"><div class="row">${avatar(S.profile)}<div class="grow"><div class="name">Your update</div><div class="preview">Share something for 24 hours</div></div></div><div class="row" style="margin-top:13px;flex-wrap:wrap"><button class="primary" id="textStoryBtn">Write text</button><button class="light" id="mediaStoryBtn">Add photo/video</button><button class="light" id="refreshStoriesBtn">Refresh</button></div><div id="storyMessage" class="status"></div></div><h3 class="tab-title">Recent updates</h3><div class="story-rail" id="storyRail"></div><div id="storyList"></div>`;$("textStoryBtn").onclick=createTextStory;$("mediaStoryBtn").onclick=createMediaStory;$("refreshStoriesBtn").onclick=async()=>{await loadStories();renderUpdates();};const rail=$("storyRail");rail.innerHTML=`<div class="story" id="myStory"><div>${avatar(S.profile)}</div><div class="story-label">＋ Add to your story</div></div>`+S.stories.map(s=>{const p=s.user_id===S.user.id?S.profile:other(s.user_id);const media=s.type==="image"&&s.media_url?`<img src="${esc(s.media_url)}" alt="">`:s.type==="video"&&s.media_url?`<video src="${esc(s.media_url)}" muted playsinline></video>`:"";return `<div class="story" data-story="${esc(s.id)}">${media}<div>${avatar(p)}</div><div class="story-label">${esc(p?.display_name||p?.username||"Update")}</div></div>`;}).join("");$("myStory").onclick=chooseStoryType;rail.querySelectorAll("[data-story]").forEach(el=>el.onclick=()=>viewStory(S.stories.find(s=>s.id===el.dataset.story)));$("storyList").innerHTML=S.stories.length?`<div class="small muted">${S.stories.length} active story/stories. Select one above to view.</div>`:'<div class="empty">No active stories yet. Create one to get started.</div>';}
function chooseStoryType(){const choice=prompt("Create which story? Type TEXT, PHOTO or VIDEO:","TEXT");if(!choice)return;const v=choice.trim().toLowerCase();if(v==="text")createTextStory();else if(v==="photo"||v==="video")createMediaStory(v);else alert("Choose TEXT, PHOTO or VIDEO.");}
async function createTextStory(){const text=prompt("Write your story. It will expire after 24 hours:");if(!text?.trim())return;try{await publishStory({type:"text",text});await loadStories();renderUpdates();}catch(e){alert("Could not publish story: "+e.message);}}
function createMediaStory(forcedType=null){const input=document.createElement("input");input.type="file";input.accept=forcedType==="photo"?"image/*":forcedType==="video"?"video/*":"image/*,video/*";input.onchange=async()=>{const file=input.files?.[0];if(!file)return;const type=file.type.startsWith("video/")?"video":"image";try{await publishStory({type,file});await loadStories();renderUpdates();}catch(e){alert("Could not publish story: "+e.message);}};input.click();}
function viewStory(s){if(!s)return;const p=s.user_id===S.user.id?S.profile:other(s.user_id);let content=s.type==="video"?`<video src="${esc(s.media_url||"")}" controls autoplay playsinline></video>`:s.type==="image"?`<img src="${esc(s.media_url||"")}" alt="Story">`:`<div class="story-text">${esc(s.text||"")}</div>`;$("storyViewer").classList.remove("hidden");$("storyViewer").innerHTML=`<div class="viewer"><button id="closeViewer" class="circle" style="position:absolute;top:18px;right:18px">×</button><div class="center"><p>${esc(p?.display_name||p?.username||"Update")}</p>${content}<p class="small">Expires ${esc(new Date(s.expires_at).toLocaleString())}</p>${s.user_id===S.user.id?'<button id="deleteStory" class="light">Delete story</button>':''}</div></div>`;$("closeViewer").onclick=()=>{$("storyViewer").classList.add("hidden");$("storyViewer").innerHTML="";};if(s.user_id===S.user.id){$("deleteStory").onclick=async()=>{if(!confirm("Delete this story?"))return;const {error}=await db.from("stories").delete().eq("id",s.id).eq("user_id",S.user.id);if(error){alert(error.message);return;}if(s.media_path)await db.storage.from(STORY_BUCKET).remove([s.media_path]);S.storyUrls.delete(s.media_path);$("storyViewer").classList.add("hidden");await loadStories();renderUpdates();};}}

// REAL CALLS: calls and call_signals tables + Supabase Realtime + WebRTC. See setup SQL supplied with this file.
const ICE_SERVERS=[{urls:"stun:stun.l.google.com:19302"},...TURN_ICE_SERVERS];
function startCallListeners(){stopCallListeners();S.callsChannel=db.channel("incoming-calls-"+S.user.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"calls",filter:`callee_id=eq.${S.user.id}`},payload=>{const c=payload.new;if(c.status==="ringing"&&!S.activeCall)showIncomingCall(c);}).subscribe();}
function stopCallListeners(){if(S.callsChannel&&db)db.removeChannel(S.callsChannel);if(S.callSignalsChannel&&db)db.removeChannel(S.callSignalsChannel);S.callsChannel=null;S.callSignalsChannel=null;}
async function renderCalls(){const {data,error}=await db.from("calls").select("id,caller_id,callee_id,call_type,status,created_at,ended_at").or(`caller_id.eq.${S.user.id},callee_id.eq.${S.user.id}`).order("created_at",{ascending:false}).limit(50);S.callRows=error?[]:(data||[]);$("sideContent").innerHTML=`<div class="panel"><h3>Voice and video calls</h3><p class="muted small">Calls use WebRTC. Reliable connectivity across all networks may require TURN credentials in the configuration.</p><button class="light" id="refreshCalls">Refresh call history</button></div>`+S.profiles.filter(p=>(p.username+" "+p.display_name).toLowerCase().includes(S.search)).map(p=>`<div class="call-row">${avatar(p)}<div class="grow"><div class="name">${esc(p.display_name||p.username)}</div><div class="preview">@${esc(p.username||"")}</div></div><div class="call-actions"><button class="circle" data-call="audio" data-id="${esc(p.id)}" title="Voice call">☎</button><button class="circle" data-call="video" data-id="${esc(p.id)}" title="Video call">▣</button></div></div>`).join("")||'<div class="empty">No contacts found.</div>';$("refreshCalls").onclick=renderCalls;$("sideContent").querySelectorAll("[data-call]").forEach(b=>b.onclick=()=>startOutgoingCall(b.dataset.id,b.dataset.call));if(S.callRows.length){const hist=document.createElement("div");hist.className="panel";hist.innerHTML='<h3>Recent calls</h3>'+S.callRows.slice(0,10).map(c=>{const id=c.caller_id===S.user.id?c.callee_id:c.caller_id,p=other(id);return `<div class="call-row"><div class="grow"><div class="name">${esc(p.display_name||p.username)}</div><div class="preview">${esc(c.call_type)} · ${esc(c.status)} · ${esc(date(c.created_at))}</div></div></div>`;}).join("");$("sideContent").appendChild(hist);}}
$("voiceBtn").onclick=()=>{if(S.selected)startOutgoingCall(S.selected.id,"audio");};$("videoBtn").onclick=()=>{if(S.selected)startOutgoingCall(S.selected.id,"video");};
let incomingRingtone=null;
function showIncomingCall(call){const caller=other(call.caller_id);$("callHost").innerHTML=`<div class="modal-bg"><div class="modal center"><div style="font-size:46px;margin:12px">${call.call_type==="video"?"▣":"☎"}</div><h3>Incoming ${esc(call.call_type)} call</h3><p>${esc(caller.display_name||caller.username)}</p><div class="modal-actions" style="justify-content:center"><button id="declineIncoming" class="light">Decline</button><button id="acceptIncoming" class="primary">Accept</button></div></div></div>`;$("declineIncoming").onclick=async()=>{await db.from("calls").update({status:"declined",ended_at:new Date().toISOString()}).eq("id",call.id);$("callHost").innerHTML="";};$("acceptIncoming").onclick=()=>answerCall(call);}
async function startOutgoingCall(calleeId,type){if(S.activeCall){alert("You already have a call open.");return;}if(calleeId===S.user.id)return;const {data:call,error}=await db.from("calls").insert({caller_id:S.user.id,callee_id:calleeId,call_type:type,status:"ringing"}).select().single();if(error){alert("Could not start call. Check the calls table and policies: "+error.message);return;}await openCallSession(call,true);}
async function answerCall(call){$("callHost").innerHTML="";const {error}=await db.from("calls").update({status:"connecting",answered_at:new Date().toISOString()}).eq("id",call.id).eq("callee_id",S.user.id);if(error){alert("Could not accept call: "+error.message);return;}await openCallSession({...call,status:"connecting"},false);}
async function openCallSession(call,isCaller){if(S.activeCall){alert("A call is already active.");return;}const peerId=isCaller?call.callee_id:call.caller_id;const peer=other(peerId);const pc=new RTCPeerConnection({iceServers:ICE_SERVERS});const session={call,pc,peerId,peer,isCaller,localStream:null,remoteStream:new MediaStream(),signalChannel:null,closed:false,seenSignals:new Set(),pendingCandidates:[]};S.activeCall=session;const type=call.call_type;$("callHost").innerHTML=`<div class="call-screen"><div class="avatar" style="width:76px;height:76px;font-size:28px">${esc(initials(peer))}</div><h2>${esc(peer.display_name||peer.username)}</h2><div id="callStatus" class="call-status">${isCaller?"Calling…":"Connecting…"}</div><video id="remoteVideo" class="${type==="video"?"":"hidden"}" autoplay playsinline></video><video id="localVideo" class="${type==="video"?"":"hidden"}" autoplay muted playsinline></video><audio id="remoteAudio" autoplay></audio><div class="call-controls"><button id="muteCall" title="Mute microphone">🎙</button><button id="cameraCall" class="${type==="video"?"":"hidden"}" title="Turn camera off">▣</button><button id="speakerCall" title="Toggle speaker">🔊</button><button id="hangupCall" class="hangup" title="End call">✕</button></div><p class="small">Keep this page open while the call is active.</p></div>`;
 const statusEl=$("callStatus"),remoteVideo=$("remoteVideo"),localVideo=$("localVideo"),remoteAudio=$("remoteAudio");pc.ontrack=e=>{if(e.streams&&e.streams[0])session.remoteStream=e.streams[0];else session.remoteStream.addTrack(e.track);remoteVideo.srcObject=session.remoteStream;remoteAudio.srcObject=session.remoteStream;statusEl.textContent="Connected";};pc.oniceconnectionstatechange=()=>{if(["failed","disconnected"].includes(pc.iceConnectionState))statusEl.textContent="Connection interrupted. Check network/TURN settings.";};
 try{session.localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:type==="video"});session.localStream.getTracks().forEach(t=>pc.addTrack(t,session.localStream));if(type==="video")localVideo.srcObject=session.localStream;}catch(e){await closeCall("failed",false);alert("Microphone/camera permission failed: "+e.message);return;}
 // Store signalling as rows, protected by participant RLS policies. Each candidate is its own row.
 const processSignal=async sig=>{if(!sig||sig.sender_id===S.user.id||session.closed||session.seenSignals.has(sig.id))return;session.seenSignals.add(sig.id);try{if(sig.kind==="offer"&&!isCaller){await pc.setRemoteDescription(new RTCSessionDescription(sig.payload));for(const candidate of session.pendingCandidates.splice(0)){try{await pc.addIceCandidate(new RTCIceCandidate(candidate));}catch(e){console.warn("Queued ICE candidate:",e.message);}}const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await insertSignal(call.id,peerId,"answer",pc.localDescription.toJSON());await db.from("calls").update({status:"connecting"}).eq("id",call.id);}else if(sig.kind==="answer"&&isCaller&&!pc.currentRemoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(sig.payload));for(const candidate of session.pendingCandidates.splice(0)){try{await pc.addIceCandidate(new RTCIceCandidate(candidate));}catch(e){console.warn("Queued ICE candidate:",e.message);}}}else if(sig.kind==="candidate"&&sig.payload){if(pc.remoteDescription){try{await pc.addIceCandidate(new RTCIceCandidate(sig.payload));}catch(e){console.warn("ICE candidate:",e.message);}}else session.pendingCandidates.push(sig.payload);}else if(sig.kind==="hangup"){await closeCall("ended",false);}}catch(e){console.error("Call signalling error",e);statusEl.textContent="Call setup failed: "+e.message;}};
 session.signalChannel=db.channel("call-signals-"+call.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"call_signals",filter:`call_id=eq.${call.id}`},payload=>processSignal(payload.new)).subscribe(async st=>{if(st==="SUBSCRIBED"){if(isCaller){try{const offer=await pc.createOffer();await pc.setLocalDescription(offer);await insertSignal(call.id,peerId,"offer",pc.localDescription.toJSON());}catch(e){statusEl.textContent="Could not create call offer: "+e.message;}}else{const {data,error}=await db.from("call_signals").select("*").eq("call_id",call.id).order("created_at",{ascending:true});if(error)statusEl.textContent="Could not load call signals: "+error.message;else for(const sig of data||[])await processSignal(sig);}}});
 pc.onicecandidate=async e=>{if(e.candidate&&!session.closed){try{await insertSignal(call.id,peerId,"candidate",e.candidate.toJSON());}catch(err){console.warn("Could not send candidate",err.message);}}};
 $("muteCall").onclick=()=>{const tracks=session.localStream?.getAudioTracks()||[];const enabled=tracks.some(t=>t.enabled);tracks.forEach(t=>t.enabled=!enabled);$("muteCall").textContent=enabled?"🔇":"🎙";};$("cameraCall").onclick=()=>{const tracks=session.localStream?.getVideoTracks()||[];const enabled=tracks.some(t=>t.enabled);tracks.forEach(t=>t.enabled=!enabled);$("cameraCall").textContent=enabled?"🚫":"▣";};$("speakerCall").onclick=()=>{remoteAudio.muted=!remoteAudio.muted;remoteVideo.muted=!remoteVideo.muted;$("speakerCall").textContent=remoteAudio.muted?"🔇":"🔊";};$("hangupCall").onclick=()=>closeCall("ended",true);
}
async function insertSignal(callId,recipientId,kind,payload){const {error}=await db.from("call_signals").insert({call_id:callId,sender_id:S.user.id,recipient_id:recipientId,kind,payload});if(error)throw error;}
async function closeCall(status="ended",sendSignal=true){const s=S.activeCall;if(!s)return;s.closed=true;S.activeCall=null;if(sendSignal){try{await insertSignal(s.call.id,s.peerId,"hangup",{});}catch(e){console.warn(e.message);}}try{s.localStream?.getTracks().forEach(t=>t.stop());s.remoteStream?.getTracks().forEach(t=>t.stop());s.pc?.close();if(s.signalChannel)await db.removeChannel(s.signalChannel);}catch(e){}await db.from("calls").update({status,ended_at:new Date().toISOString()}).eq("id",s.call.id);$("callHost").innerHTML="";if(S.tab==="calls")renderCalls();}
